name: CI

on:
  push:
    branches: [master, main, superadmin, dev2]
  pull_request:
    branches: [master, main]

jobs:
  isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: build_ex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/build_ex
      JWT_SECRET: ci_test_secret_key_for_isolation_suite_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply control-plane schema
        run: npx tsx scripts/migrate-platform-schema.ts
      - name: Ensure tenant_migrations table
        run: |
          npx tsx -e "
          import postgres from 'postgres';
          const sql = postgres(process.env.DATABASE_URL!, { max: 1 });
          await sql\`CREATE EXTENSION IF NOT EXISTS pgcrypto\`;
          await sql\`CREATE TABLE IF NOT EXISTS tenants (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            name varchar(255) NOT NULL,
            slug varchar(100) NOT NULL UNIQUE,
            schema_name varchar(100) NOT NULL UNIQUE,
            status varchar(50) NOT NULL DEFAULT 'provisioning',
            legal_name varchar(255),
            industry varchar(100),
            company_size varchar(50),
            gstin varchar(20),
            pan varchar(20),
            cin varchar(30),
            website varchar(255),
            address_line1 varchar(255),
            address_line2 varchar(255),
            city varchar(100),
            state varchar(100),
            pincode varchar(20),
            country varchar(100),
            contact_name varchar(255),
            contact_email varchar(255),
            contact_phone varchar(30),
            contact_designation varchar(100),
            billing_email varchar(255),
            admin_name varchar(255),
            admin_email varchar(255),
            branding jsonb,
            feature_flags jsonb,
            usage jsonb DEFAULT '{}'::jsonb,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now(),
            deleted_at timestamptz
          )\`;
          await sql\`CREATE TABLE IF NOT EXISTS tenant_migrations (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            tenant_id uuid NOT NULL REFERENCES tenants(id),
            migration_name varchar(255) NOT NULL,
            applied_at timestamptz NOT NULL DEFAULT now(),
            UNIQUE(tenant_id, migration_name)
          )\`;
          await sql.end();
          "
      - run: npm run test:isolation
